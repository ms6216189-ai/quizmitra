
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuizMitra - Student Quiz</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#eef3f9;
 color:#172554;
}
header{
 background:#1565c0;
 color:white;
 text-align:center;
 padding:22px 10px;
}
header h1{margin:0}
.container{
 max-width:750px;
 margin:25px auto;
 padding:15px;
}
.card{
 background:white;
 padding:22px;
 border-radius:14px;
 margin-bottom:18px;
 box-shadow:0 3px 15px #0001;
}
input{
 width:100%;
 padding:13px;
 margin:8px 0;
 border:1px solid #ccc;
 border-radius:8px;
 font-size:16px;
}
button{
 width:100%;
 padding:14px;
 margin-top:12px;
 background:#1565c0;
 color:white;
 border:0;
 border-radius:8px;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
}
button:disabled{opacity:.5}
.question{
 padding:16px;
 border:1px solid #ddd;
 border-radius:10px;
 margin:15px 0;
}
.option{
 display:block;
 background:#f1f5f9;
 padding:12px;
 margin:9px 0;
 border-radius:8px;
 cursor:pointer;
}
.option input{
 width:auto;
 margin-right:8px;
}
.hidden{display:none}
#result{
 text-align:center;
}
.score{
 font-size:40px;
 color:#1565c0;
 font-weight:bold;
}
.small{color:#64748b}
</style>
</head>

<body>

<header>
<h1>QuizMitra</h1>
<p>Student Quiz Portal</p>
</header>

<div class="container">

<!-- STUDENT LOGIN -->
<div class="card" id="joinBox">
<h2>Join Quiz</h2>

<input id="studentName" placeholder="વિદ્યાર્થીનું નામ">
<input id="rollNo" placeholder="Roll Number">
<input id="joinCode" placeholder="Quiz Join Code">

<button id="joinBtn" onclick="joinQuiz()">Start Quiz</button>

<p id="message" class="small"></p>
</div>

<!-- QUIZ AREA -->
<div class="card hidden" id="quizBox">

<h2 id="quizTitle">Quiz</h2>
<p id="studentInfo"></p>
<p id="questionCount"></p>

<div id="questions"></div>

<button id="submitBtn" onclick="submitQuiz()">
Submit Quiz
</button>

</div>

<!-- RESULT -->
<div class="card hidden" id="result">

<h2>Quiz Completed!</h2>
<p>Your Result</p>

<div class="score" id="score">0/0</div>

<p id="resultName"></p>
<p id="resultMessage"></p>

</div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>

// ==================================
// FIREBASE CONFIG
// ==================================

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyA1v2fI7LmVCBb5kQdONPjlL5bANRESzC8",
  authDomain: "radhe-454c2.firebaseapp.com",
  databaseURL: "https://radhe-454c2-default-rtdb.firebaseio.com",
  projectId: "radhe-454c2",
  storageBucket: "radhe-454c2.firebasestorage.app",
  messagingSenderId: "100122845234",
  appId: "1:100122845234:web:8025d5457f0a2893191c2b",
  measurementId: "G-NKK1C86SCN"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

// ==================================
// VARIABLES
// ==================================

let currentQuiz = null;
let currentQuizId = "";
let student = {};
let submitted = false;

// ==================================
// STUDENT AUTHENTICATION
// ==================================

auth.signInAnonymously()
.then(()=>{
 console.log("Student connected to Firebase");
})
.catch(error=>{
 document.getElementById("message").innerText =
 "Firebase Login Error: " + error.message;
});

// ==================================
// JOIN QUIZ
// ==================================

async function joinQuiz(){

 if(!auth.currentUser){
  document.getElementById("message").innerText =
   "Firebase connection થઈ રહ્યું છે. થોડી વાર રાહ જુઓ.";
  return;
 }

 const name = document.getElementById("studentName").value.trim();
 const roll = document.getElementById("rollNo").value.trim();
 const code = document.getElementById("joinCode").value.trim().toUpperCase();

 if(!name || !roll || !code){
  alert("બધી વિગતો ભરો.");
  return;
 }

 const btn=document.getElementById("joinBtn");
 btn.disabled=true;

 try{

  const snapshot = await db.ref("quizzes/"+code).once("value");

  if(!snapshot.exists()){
   alert("ખોટો Quiz Join Code!");
   return;
  }

  currentQuiz=snapshot.val();
  currentQuizId=code;

  if(currentQuiz.status !== "active"){
   alert("આ Quiz હાલમાં બંધ છે.");
   return;
  }

  if(!Array.isArray(currentQuiz.questions) ||
     currentQuiz.questions.length===0){
   alert("Quiz માં પ્રશ્નો ઉપલબ્ધ નથી.");
   return;
  }

  student={
   name:name,
   rollNo:roll
  };

  document.getElementById("joinBox").classList.add("hidden");
  document.getElementById("quizBox").classList.remove("hidden");

  document.getElementById("quizTitle").innerText=currentQuiz.title;
  document.getElementById("studentInfo").innerText=
   "Student: "+name+" | Roll No: "+roll;

  document.getElementById("questionCount").innerText=
   "Total Questions: "+currentQuiz.questions.length;

  displayQuestions();

 }catch(error){
  alert("Error: "+error.message);
 }finally{
  btn.disabled=false;
 }

}

// ==================================
// DISPLAY QUESTIONS
// ==================================

function displayQuestions(){

 const area=document.getElementById("questions");
 area.innerHTML="";

 currentQuiz.questions.forEach((q,index)=>{

  const box=document.createElement("div");
  box.className="question";

  const heading=document.createElement("h3");
  heading.textContent=(index+1)+". "+q.question;
  box.appendChild(heading);

  q.options.forEach(option=>{

   const label=document.createElement("label");
   label.className="option";

   const radio=document.createElement("input");
   radio.type="radio";
   radio.name="question_"+index;
   radio.value=option;

   const text=document.createTextNode(option);

   label.appendChild(radio);
   label.appendChild(text);
   box.appendChild(label);

  });

  area.appendChild(box);

 });

}

// ==================================
// SUBMIT QUIZ
// ==================================

async function submitQuiz(){

 if(submitted) return;

 const questions=currentQuiz.questions;
 let marks=0;
 let totalMarks=0;
 let answered=0;

 questions.forEach((q,index)=>{

  const weight=Number(q.marks)||1;
  totalMarks+=weight;

  const selected=document.querySelector(
   'input[name="question_'+index+'"]:checked'
  );

  if(selected){
   answered++;

   if(String(selected.value).trim() === String(q.answer).trim()){
    marks+=weight;
   }
  }

 });

 if(answered===0){
  alert("ઓછામાં ઓછા એક પ્રશ્નનો જવાબ આપો.");
  return;
 }

 const confirmSubmit=confirm(
  "શું તમે Quiz Submit કરવા માંગો છો?"
 );

 if(!confirmSubmit) return;

 submitted=true;

 const btn=document.getElementById("submitBtn");
 btn.disabled=true;
 btn.innerText="Saving Result...";

 const resultData={
  name:student.name,
  rollNo:student.rollNo,
  quizId:currentQuizId,
  marks:marks,
  totalMarks:totalMarks,
  answered:answered,
  submittedAt:firebase.database.ServerValue.TIMESTAMP
 };

 try{

  await db.ref("quizResults").push(resultData);

  document.getElementById("quizBox").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");

  document.getElementById("score").innerText=
   marks+" / "+totalMarks;

  document.getElementById("resultName").innerText=
   "Name: "+student.name+" | Roll No: "+student.rollNo;

  document.getElementById("resultMessage").innerText=
   "તમારું પરિણામ સફળતાપૂર્વક સેવ થયું છે.";

 }catch(error){

  submitted=false;
  btn.disabled=false;
  btn.innerText="Submit Quiz";

  alert("Result Save Error: "+error.message);

 }

}

</script>

</body>
</html>
